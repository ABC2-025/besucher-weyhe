<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#CF1F60">
<title>Besucher – Verwaltung ABC Kochwerk</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--pri:#CF1F60;--pri-d:#A8164C;--pri-l:#FBE7EF;--grn:#6E9A2E;--grn-l:#EEF5E3;--org:#F59E22;--org-l:#FEF3E2;
  --ink:#1F2328;--ink2:#59616B;--line:#E3E6EA;--bg:#F6F7F9;--card:#fff;--red:#C62828;--red-l:#FDECEC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.brand small{display:block;font-weight:500;font-size:13px;color:var(--ink2)}
.user{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:14px}
main{max-width:1320px;margin:0 auto;padding:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
h2{margin:0 0 4px;font-size:21px}
.sub{color:var(--ink2);margin:0 0 16px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;background:#fff;border:1.5px solid #CBD0D6;color:var(--ink);white-space:nowrap}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.g{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.w{color:var(--red);border-color:#E6B3B3}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input.t,select.t{font:inherit;padding:10px 12px;border:1.5px solid #CBD0D6;border-radius:10px;background:#fff;color:var(--ink)}
input.t:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
.full{width:100%}
.msg{border-radius:10px;padding:10px 14px;margin-top:12px;display:none}
.msg.on{display:block}.msg.err{background:var(--red-l);color:var(--red)}.msg.ok{background:var(--grn-l);color:#3F5E12}
.login{max-width:430px;margin:6vh auto}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:11px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:8px;font-weight:600;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tabs .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--pri);color:#fff;font-size:12px;margin-left:6px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:var(--bg);border-radius:12px;padding:10px 16px;min-width:150px}
.kpi b{display:block;font-size:26px;line-height:1.2}.kpi span{color:var(--ink2);font-size:13px}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 300px)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--ink2);font-weight:600;border-bottom:1.5px solid var(--line);padding:9px 10px;position:sticky;top:0;background:#fff;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:middle}
tr.row{cursor:pointer} tr.row:hover td{background:#FAFBFC}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.in{background:var(--grn-l);color:#3F5E12}.tag.auto{background:var(--org-l);color:#8A4B00}.tag.no{background:var(--red-l);color:var(--red)}.tag.pend{background:var(--pri-l);color:var(--pri-d)}
.empty{color:var(--ink2);text-align:center;padding:26px}
.upd{color:var(--ink2);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(20,24,28,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.on{display:flex}.modal .card{width:100%;max-width:980px;max-height:92vh;overflow:auto}.modal .card.s{max-width:460px}
.det{display:grid;grid-template-columns:220px 1fr;gap:6px 16px}
.det dt{color:var(--ink2)}.det dd{margin:0}
.det img{max-width:100%;max-height:180px;border:1px solid var(--line);border-radius:8px;background:#fff}
.beltext{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;font-size:12.5px;max-height:240px;overflow:auto}
.hide{display:none!important}
.ed{display:none}
a.btn{text-decoration:none;display:inline-block}
.ed.on{display:block}
.ed-info{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.ed-info .dirty{color:var(--pri-d);font-weight:700}
.ed-sec{border:1px solid var(--line);border-radius:14px;margin-bottom:14px;background:#fff}
.ed-sec>summary{cursor:pointer;padding:14px 18px;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.ed-sec>summary::-webkit-details-marker{display:none}
.ed-sec>summary::after{content:'▾';color:var(--ink2)}
.ed-sec[open]>summary::after{content:'▴'}
.ed-sec>summary small{font-weight:500;color:var(--ink2);margin-left:8px}
.ed-body{padding:0 18px 18px}
.ed-hint{color:var(--ink2);font-size:13px;margin:0 0 10px}
.ft{width:100%;border-collapse:collapse}
.ft th{position:static;font-size:13px;padding:6px}
.ft td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.ft input.t,.ft select.t{width:100%;padding:8px 10px;font-size:14px}
.ft .mv{display:flex;flex-direction:column;gap:2px}
.ft .mv button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 6px;font-size:12px;line-height:18px}
.ft .cb{text-align:center}
.ft .cb input{width:20px;height:20px;accent-color:var(--pri)}
.ft tr.sub td{background:#FAFBFC;border-bottom:1px solid var(--line)}
.ft tr.off td{opacity:.55}
textarea.t{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1.5px solid #CBD0D6;border-radius:10px;min-height:70px;resize:vertical}
textarea.t:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two label{font-size:12px;color:var(--ink2);font-weight:600;display:block;margin-bottom:3px}
.trow{padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow>b{display:block;margin-bottom:6px;font-size:14px}
.bsec{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.bsec .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.tag.fest{background:#EEF0F3;color:var(--ink2)}
#print{display:none}
@media print{
  body{background:#fff;font-size:11pt} header,main,.modal{display:none!important} #print{display:block}
  #print h1{font-size:17pt;margin:0 0 4px}
  #print table{width:100%;border-collapse:collapse}
  #print th,#print td{border:1px solid #999;padding:5px 6px;text-align:left;font-size:10pt;vertical-align:top;position:static}
  #print .beltext{white-space:pre-wrap;font-size:9pt;border:1px solid #ccc;padding:8px;max-height:none;background:#fff}
  #print img{max-height:120px}
}
@media (max-width:760px){
  header{padding:10px 14px} .brand small,.user .nm{display:none}
  main{padding:12px} .card{padding:14px}
  .det{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .ft{font-size:13px}
  .hide-m{display:none}
  .kpi{min-width:0;padding:8px 12px}.kpi b{font-size:20px}
}
</style>
<link rel="stylesheet" href="abc-stil.css">
</head>
<body>
<header>
  <div class="brand"><img class="abc" src="img/abc-logo.svg" alt="ABC Kochwerk"><div class="kopf"><span class="eb">Besucher · Verwaltung</span><small>Zentrale Weyhe</small></div></div>
  <div class="user hide" id="userbox"><span class="nm" id="u_name"></span><button class="btn sm hide-m" id="b_pw">Passwort ändern</button><button class="btn sm" id="b_logout">Abmelden</button></div>
</header>

<main>
  <!-- Login -->
  <div id="v_login" class="login">
    <div class="card">
      <h2>Anmelden</h2>
      <p class="sub">Nur für freigegebene Mitarbeitende.</p>
      <label class="f">E-Mail</label><input class="t full" id="l_mail" type="email" autocomplete="username">
      <label class="f">Passwort</label><input class="t full" id="l_pw" type="password" autocomplete="current-password">
      <div class="msg err" id="m_login"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
        <button class="btn" id="b_req_open" style="border:0;color:var(--pri);padding-left:0">Zugang beantragen</button>
        <button class="btn p" id="b_login">Anmelden</button>
      </div>
    </div>
    <div class="card hide" id="reqcard" style="margin-top:14px">
      <h2>Zugang beantragen</h2>
      <p class="sub">Ein Administrator muss Ihren Zugang freigeben, bevor Sie sich anmelden können.</p>
      <label class="f">Vor- und Nachname</label><input class="t full" id="r_name" autocomplete="name">
      <label class="f">Dienstliche E-Mail</label><input class="t full" id="r_mail" type="email" autocomplete="email">
      <label class="f">Passwort (mind. 10 Zeichen)</label><input class="t full" id="r_pw" type="password" autocomplete="new-password">
      <div class="msg" id="m_req"></div>
      <div style="text-align:right;margin-top:14px"><button class="btn p" id="b_req">Antrag senden</button></div>
    </div>
  </div>

  <!-- App -->
  <div id="v_app" class="hide">
    <div class="card">
      <div class="bar">
        <div class="tabs" id="tabs">
          <button class="on" data-tab="haus">Jetzt im Haus</button>
          <button data-tab="verlauf">Verlauf</button>
          <button data-tab="nutzer" class="hide" id="tab_nutzer">Zugänge<span class="badge hide" id="badge_n"></span></button>
          <button data-tab="formular" class="hide" id="tab_formular">Formular &amp; Texte</button>
        </div>
        <div class="tools" id="t_haus"><span class="upd" id="upd"></span><button class="btn g" id="b_evak">Evakuierungsliste drucken</button><button class="btn" id="b_reload">Aktualisieren</button></div>
        <div class="tools hide" id="t_verlauf">
          <input class="t" type="date" id="f_von"> – <input class="t" type="date" id="f_bis">
          <input class="t" id="f_q" placeholder="Name, Firma, Ansprechpartner" style="width:220px">
          <button class="btn" id="b_load">Anzeigen</button><button class="btn" id="b_csv">CSV-Export</button>
        </div>
        <div class="tools hide" id="t_nutzer"><button class="btn p" id="b_new">Zugang anlegen</button></div>
        <div class="tools hide" id="t_formular"><a class="btn" href="./" target="_blank" rel="noopener">Tablet-Ansicht öffnen</a><button class="btn" id="fe_std">Standard laden</button><button class="btn" id="fe_reset">Verwerfen</button><button class="btn p" id="fe_save">Speichern &amp; veröffentlichen</button></div>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="tblwrap" id="tblwrap"><table id="tbl"></table></div>
      <div class="ed" id="formular"></div>
      <div class="msg err" id="m_app"></div>
    </div>
  </div>
</main>

<div class="modal" id="mod_det"><div class="card" id="det"></div></div>
<div class="modal" id="mod_pw"><div class="card s">
  <h2>Passwort ändern</h2>
  <label class="f">Bisheriges Passwort</label><input class="t full" type="password" id="pw_alt" autocomplete="current-password">
  <label class="f">Neues Passwort (mind. 10 Zeichen)</label><input class="t full" type="password" id="pw_neu" autocomplete="new-password">
  <label class="f">Wiederholen</label><input class="t full" type="password" id="pw_neu2" autocomplete="new-password">
  <div class="msg err" id="m_pw"></div>
  <div style="display:flex;justify-content:space-between;margin-top:16px"><button class="btn" data-close>Abbrechen</button><button class="btn p" id="b_pw_ok">Speichern</button></div>
</div></div>
<div class="modal" id="mod_new"><div class="card s">
  <h2>Zugang anlegen</h2>
  <label class="f">Vor- und Nachname</label><input class="t full" id="n_name">
  <label class="f">E-Mail</label><input class="t full" id="n_mail" type="email">
  <label class="f">Start-Passwort (mind. 10 Zeichen)</label><input class="t full" id="n_pw">
  <label class="f">Rolle</label><select class="t full" id="n_rolle"><option value="leser">Leser – sieht Besucher, kann abmelden</option><option value="admin">Admin – zusätzlich Zugänge & Löschen</option></select>
  <div class="msg err" id="m_new"></div>
  <div style="display:flex;justify-content:space-between;margin-top:16px"><button class="btn" data-close>Abbrechen</button><button class="btn p" id="b_new_ok">Anlegen</button></div>
</div></div>
<div id="print"></div>

<script src="formular-standard.js"></script>
<script>
const CONFIG = {
  supabaseUrl: 'https://ywmimuctohdmxkmexops.supabase.co',
  supabaseKey: 'sb_publishable_BDxHs8FE36DMxpiU4MPGRA_nPAr65lo',
  firma: 'ABC Kochwerk GmbH', standort: 'Zentrale Weyhe', adresse: 'Gutenbergstraße 7a, 28844 Weyhe',
  aktualisierenSekunden: 30,
};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ={timeZone:'Europe/Berlin'};
const hhmm=d=>new Date(d).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',...TZ});
const dt=d=>d?new Date(d).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',...TZ}):'';
const day=d=>new Date(d).toLocaleDateString('sv-SE',TZ);
const today=()=>day(new Date());
function msg(id,t,cls){const m=$(id);m.innerHTML=t||'';m.classList.toggle('on',!!t);if(cls)m.className='msg '+cls+(t?' on':'');}
const store={get(){try{return sessionStorage.getItem('bes_tok')}catch(e){return null}},set(v){try{v?sessionStorage.setItem('bes_tok',v):sessionStorage.removeItem('bes_tok')}catch(e){}}};

let TOKEN=store.get(), ME=null, ROWS=[], USERS=[], TAB='haus', timer=null;

async function rpc(fn,args){
  const r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/rpc/${fn}`,{method:'POST',
    headers:{'Content-Type':'application/json',apikey:CONFIG.supabaseKey,Authorization:`Bearer ${CONFIG.supabaseKey}`},body:JSON.stringify(args||{})});
  const txt=await r.text(); let d=null; try{d=txt?JSON.parse(txt):null}catch(e){d=txt}
  if(!r.ok){ const m=(d&&d.message)||('Fehler '+r.status); if(d&&d.code==='28000'){ logout(true); } throw new Error(m); }
  return d;
}

/* ---------- Login ---------- */
async function start(){
  if(TOKEN){ try{ ME=await rpc('besucher_ich',{p_token:TOKEN}); return enter(); }catch(e){ TOKEN=null; store.set(null); } }
  showLogin();
}
function showLogin(){ $('#v_login').classList.remove('hide'); $('#v_app').classList.add('hide'); $('#userbox').classList.add('hide'); setTimeout(()=>$('#l_mail').focus(),50); }
$('#b_login').onclick=async()=>{
  msg('#m_login','');
  try{ const r=await rpc('besucher_login',{p_email:$('#l_mail').value,p_pw:$('#l_pw').value});
    if(r.fehler) throw new Error(r.fehler);
    TOKEN=r.token; store.set(TOKEN); ME=r; $('#l_pw').value=''; enter(); }
  catch(e){ msg('#m_login',esc(e.message)); }
};
$('#l_pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#b_login').click()});
$('#b_req_open').onclick=()=>$('#reqcard').classList.toggle('hide');
$('#b_req').onclick=async()=>{
  try{ await rpc('besucher_registrieren',{p_email:$('#r_mail').value,p_name:$('#r_name').value,p_pw:$('#r_pw').value});
    msg('#m_req','Antrag gesendet. Sie können sich anmelden, sobald ein Administrator Ihren Zugang freigegeben hat.','ok');
    $('#r_pw').value=''; }
  catch(e){ msg('#m_req',esc(e.message),'err'); }
};
function enter(){
  $('#v_login').classList.add('hide'); $('#v_app').classList.remove('hide'); $('#userbox').classList.remove('hide');
  $('#u_name').textContent=`${ME.name} (${ME.rolle==='admin'?'Admin':'Leser'})`;
  $('#tab_nutzer').classList.toggle('hide',ME.rolle!=='admin');
  $('#tab_formular').classList.toggle('hide',ME.rolle!=='admin');
  loadCfg();
  setTab('haus');
  clearInterval(timer); timer=setInterval(()=>{ if(TAB==='haus' && !document.hidden && !$('.modal.on')) load(); }, CONFIG.aktualisierenSekunden*1000);
  if(ME.rolle==='admin') loadUsers(true);
}
async function logout(expired){
  clearInterval(timer);
  if(TOKEN && !expired){ try{ await rpc('besucher_logout',{p_token:TOKEN}); }catch(e){} }
  TOKEN=null; ME=null; ROWS=[]; store.set(null); $$('.modal').forEach(m=>m.classList.remove('on'));
  showLogin(); if(expired) msg('#m_login','Sitzung abgelaufen – bitte neu anmelden.');
}
$('#b_logout').onclick=()=>logout(false);

/* ---------- Tabs ---------- */
$$('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function setTab(t){
  TAB=t; $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $('#t_haus').classList.toggle('hide',t!=='haus'); $('#t_verlauf').classList.toggle('hide',t!=='verlauf'); $('#t_nutzer').classList.toggle('hide',t!=='nutzer');
  $('#t_formular').classList.toggle('hide',t!=='formular');
  $('#kpis').classList.toggle('hide',t==='formular'); $('#tblwrap').classList.toggle('hide',t==='formular'); $('#formular').classList.toggle('on',t==='formular');
  msg('#m_app',''); if(t==='formular') return feOpen(); t==='nutzer'?loadUsers():load();
}
$('#f_von').value=day(Date.now()-6*864e5); $('#f_bis').value=today();
$('#b_reload').onclick=load; $('#b_load').onclick=load; $('#f_q').addEventListener('input',render);

/* ---------- Besucher ---------- */
async function load(){
  try{
    const von=TAB==='haus'?today():$('#f_von').value, bis=TAB==='haus'?today():$('#f_bis').value;
    ROWS=await rpc('besucher_liste_v2',{p_token:TOKEN,von,bis});
    $('#upd').textContent='Stand '+hhmm(new Date())+' · aktualisiert automatisch';
    render();
  }catch(e){ msg('#m_app',esc(e.message)); }
}
function rows(){
  if(TAB==='haus') return ROWS.filter(x=>!x.checkout_at);
  let r=ROWS.filter(x=>{const d=day(x.checkin_at);return d>=$('#f_von').value&&d<=$('#f_bis').value;});
  const q=$('#f_q').value.trim().toLowerCase();
  if(q) r=r.filter(x=>`${x.vorname} ${x.nachname} ${x.firma||''} ${x.ansprechpartner}`.toLowerCase().includes(q));
  return r;
}
function status(x){
  if(!x.checkout_at) return '<span class="tag in">im Haus</span>';
  if(x.checkout_art==='automatisch') return '<span class="tag auto">nicht abgemeldet</span>';
  return hhmm(x.checkout_at)+((x.checkout_art||'').startsWith('verwaltung')?' <small title="'+esc(x.checkout_art)+'">(Verw.)</small>':'');
}
function render(){
  if(TAB==='nutzer') return renderUsers();
  const r=rows();
  if(TAB==='haus'){
    $('#kpis').innerHTML=`<div class="kpi"><b>${r.length}</b><span>Personen im Haus</span></div>
      <div class="kpi"><b>${r.filter(x=>/Küche|Mehrere|Lager|Produktion/.test(x.bereich||'')).length}</b><span>in Küche, Produktion oder Lager</span></div>
      <div class="kpi"><b style="color:${r.some(x=>!x.gesundheit_bestaetigt)?'var(--red)':'inherit'}">${r.filter(x=>!x.gesundheit_bestaetigt).length}</b><span>ohne Gesundheitserklärung</span></div>`;
    $('#tbl').innerHTML=`<thead><tr><th>Seit</th><th>Name</th><th>Firma</th><th class="hide-m">Gruppe</th><th>Bereich</th><th>Ansprechpartner</th><th class="hide-m">Telefon</th><th>Gesundh.</th><th></th></tr></thead><tbody>`+

function zusatz(a){ return Object.entries(a||{}).filter(([k])=>!STD_KEYS.includes(k)).map(([k,v])=>[feldLabel(k),v]); }

  for(const k of ['stammdaten','texte','belehrung','gesundheit','datenschutz']) c[k]=c[k]?(k==='texte'||k==='stammdaten'?{...S[k],...c[k]}:c[k]):S[k];

  </div></details>
  <details class="ed-sec" data-s="bel" ${isOpen('bel')?'open':''}><summary>Hygienebelehrung <small>${c.belehrung.abschnitte.length} Abschnitte</small></summary><div class="ed-body">
    <p class="ed-hint">Format: Leerzeile = neuer Absatz · Zeile mit „- “ = Aufzählungspunkt · **Text** = fett. Bei inhaltlichen Änderungen erhält die Belehrung beim Speichern automatisch eine neue Versionsnummer – jeder Nachweis behält den Text, der unterschrieben wurde.</p>
    ${c.belehrung.abschnitte.map((b,i)=>`<div class="bsec"><div class="hd"><span>Abschnitt ${i+1}</span><div class="tools"><button class="btn sm" data-bmv="${i}" data-d="-1" ${i===0?'disabled':''}>▲</button><button class="btn sm" data-bmv="${i}" data-d="1" ${i===c.belehrung.abschnitte.length-1?'disabled':''}>▼</button><button class="btn sm w" data-bdel="${i}">Entfernen</button></div></div>
      <div class="two" style="margin-bottom:8px"><div><label>Überschrift Deutsch</label><input class="t full" data-p="belehrung.abschnitte.${i}.titel.de" value="${esc(b.titel.de)}"></div><div><label>Überschrift English</label><input class="t full" data-p="belehrung.abschnitte.${i}.titel.en" value="${esc(b.titel.en||'')}"></div></div>
      ${two('belehrung.abschnitte.'+i+'.text',7)}</div>`).join('')}
    <button class="btn" id="fe_badd">+ Abschnitt hinzufügen</button>
  </div></details>
  <details class="ed-sec" data-s="gz" ${isOpen('gz')?'open':''}><summary>Gesundheitserklärung (§ 42 IfSG)</summary><div class="ed-body">
    <div class="trow"><b>Erklärungstext</b>${two('gesundheit.text',8)}</div>
    <div class="trow"><b>Hinweis, wenn jemand „nicht bestätigen“ wählt</b>${two('gesundheit.warnung',3)}</div>
  </div></details>
  <details class="ed-sec" data-s="ds" ${isOpen('ds')?'open':''}><summary>Datenschutzhinweis</summary><div class="ed-body">
    <p class="ed-hint">Platzhalter: {firma}, {adresse}, {kontakt} werden aus den Stammdaten eingesetzt. Löschfristen im Text bitte nur ändern, wenn sie auch in der Datenbank angepasst wurden.</p>${two('datenschutz',12)}
  </div></details>
  <details class="ed-sec" data-s="sd" ${isOpen('sd')?'open':''}><summary>Stammdaten</summary><div class="ed-body">
    <div class="two"><div><label>Firma</label><input class="t full" data-p="stammdaten.firma" value="${esc(c.stammdaten.firma)}"></div><div><label>Standort</label><input class="t full" data-p="stammdaten.standort" value="${esc(c.stammdaten.standort)}"></div>
    <div><label>Adresse</label><input class="t full" data-p="stammdaten.adresse" value="${esc(c.stammdaten.adresse)}"></div><div><label>Kontakt Datenschutz</label><input class="t full" data-p="stammdaten.datenschutzKontakt" value="${esc(c.stammdaten.datenschutzKontakt)}"></div></div>
  </div></details>`;
  const F=$('#formular');
  F.querySelectorAll('[data-p]').forEach(el=>el.addEventListener('input',()=>{ setP(CFG,el.dataset.p,el.value); feState(); }));
  F.querySelectorAll('[data-b]').forEach(el=>el.addEventListener('change',()=>{ setP(CFG,el.dataset.b,el.checked); feRender(); }));
  F.querySelectorAll('[data-typ]').forEach(el=>el.addEventListener('change',()=>{ const f=CFG.felder[+el.dataset.typ]; const alt=f.typ; f.typ=el.value;
    if((alt==='person')!==(f.typ==='person')) f.optionen=[];
    if((f.typ==='auswahl'||f.typ==='mehrfach')&&!(f.optionen||[]).length) f.optionen=[{de:'Option 1',en:'Option 1'}]; feRender(); }));
  F.querySelectorAll('[data-optta]').forEach(el=>el.addEventListener('input',()=>{ const ff=CFG.felder[+el.dataset.optta]; ff.optionen=el.value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{ const [a,b]=x.split('|').map(y=>y.trim()); return ff.typ==='person'?{name:a,abteilung:b||''}:{de:a,en:b||a}; }); feState(); }));
  F.querySelectorAll('[data-opt]').forEach(el=>el.onclick=()=>{ const k=el.dataset.opt; feOpenOpt.has(k)?feOpenOpt.delete(k):feOpenOpt.add(k); feRender(); });
  F.querySelectorAll('[data-mv]').forEach(el=>el.onclick=()=>{ const i=+el.dataset.mv, j=i+(+el.dataset.d); const a=CFG.felder; [a[i],a[j]]=[a[j],a[i]]; feRender(); });
  F.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{ const f=CFG.felder[+el.dataset.del]; if(confirm(`Feld „${f.label.de}“ entfernen? (Bei alten Besuchen bleibt der Wert gespeichert.)`)){ CFG.felder.splice(+el.dataset.del,1); feRender(); } });
  F.querySelectorAll('[data-bmv]').forEach(el=>el.onclick=()=>{ const i=+el.dataset.bmv, j=i+(+el.dataset.d); const a=CFG.belehrung.abschnitte; [a[i],a[j]]=[a[j],a[i]]; feRender(); });
  F.querySelectorAll('[data-bdel]').forEach(el=>el.onclick=()=>{ if(confirm('Abschnitt entfernen?')){ CFG.belehrung.abschnitte.splice(+el.dataset.bdel,1); feRender(); } });
  $('#fe_add').onclick=()=>{ CFG.felder.push({key:'feld_'+Date.now().toString(36),typ:'text',pflicht:false,aktiv:true,label:{de:'Neues Feld',en:'New field'}}); feRender(); };
  $('#fe_badd').onclick=()=>{ CFG.belehrung.abschnitte.push({titel:{de:'Neuer Abschnitt',en:'New section'},text:{de:'',en:''}}); feRender(); $$('#formular details[data-s=bel]')[0].open=true; };
  feState();
}
function feState(){ const d=dirty(); $('#fe_state').innerHTML=d?'<span class="dirty">● Ungespeicherte Änderungen</span>':'<span style="color:var(--grn)">✓ Alles gespeichert</span>';
  $('#fe_save').disabled=!d; $('#fe_reset').disabled=!d; }
$('#fe_reset').onclick=()=>{ if(confirm('Alle ungespeicherten Änderungen verwerfen?')){ CFG=JSON.parse(CFG_ORIG); feRender(); } };
$('#fe_std').onclick=()=>{ if(confirm('Alle Felder und Texte auf die ursprünglichen Standardwerte zurücksetzen? (Erst mit „Speichern“ wirksam.)')){ CFG=vervollst(clone(FORMULAR_STANDARD)); feRender(); } };
$('#fe_save').onclick=async()=>{
  msg('#m_fe','');
  const keys=new Set(), fehler=[];
  CFG.felder.forEach(f=>{ if(!f.label.de.trim()) fehler.push('Ein Feld hat keine deutsche Bezeichnung.'); if(!f.label.en||!f.label.en.trim()) f.label.en=f.label.de;
    if(keys.has(f.key)) fehler.push('Doppeltes Feld: '+f.key); keys.add(f.key);
    if((f.typ==='auswahl'||f.typ==='mehrfach')&&!(f.optionen||[]).length) fehler.push(`„${f.label.de}“ braucht mindestens eine Kategorie.`);
    if(f.typ==='email'||f.typ==='tel') delete f.optionen; });
  if(!CFG.belehrung.abschnitte.length) fehler.push('Die Belehrung braucht mindestens einen Abschnitt.');
  if(fehler.length) return msg('#m_fe',fehler.map(esc).join('<br>'));
  const alt=JSON.parse(CFG_ORIG), belNeu=JSON.stringify([CFG.belehrung.abschnitte,CFG.gesundheit.text,CFG.texte.ck_bel])!==JSON.stringify([alt.belehrung.abschnitte,alt.gesundheit.text,alt.texte.ck_bel]);
  if(!confirm(`Änderungen veröffentlichen?${belNeu?'\n\nDie Belehrung hat sich geändert und erhält eine neue Versionsnummer.':''}\n\nDas Tablet übernimmt sie beim nächsten Zurückkehren zur Startseite (spätestens nach wenigen Minuten).`)) return;
  if(belNeu){ const ym=today().slice(0,7); CFG.belehrung.version=`BEL-${ym}-v${(FE_SAVED&&FE_SAVED.version||0)+2}`; }
  try{ FE_SAVED=await rpc('besucher_formular_speichern',{p_token:TOKEN,p_cfg:CFG}); CFG=vervollst(clone(FE_SAVED)); CFG_ORIG=JSON.stringify(CFG); feRender(); msg('#m_fe','Gespeichert und veröffentlicht.','ok'); }
  catch(e){ msg('#m_fe',esc(e.message),'err'); }
};

start();
</script>
</body>
</html>

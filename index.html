<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#CF1F60">
<meta name="mobile-web-app-capable" content="yes">
<title>Besucheranmeldung ABC Kochwerk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --pri:#CF1F60; --pri-d:#A8164C; --pri-l:#FBE7EF;
  --grn:#6E9A2E; --grn-l:#EEF5E3; --org:#F59E22; --org-l:#FEF3E2;
  --ink:#1F2328; --ink2:#59616B; --line:#E3E6EA; --bg:#F6F7F9; --card:#FFFFFF; --red:#C62828; --red-l:#FDECEC;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:18px;line-height:1.45}
body{overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;cursor:pointer}
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:22px;letter-spacing:.2px}
.brand .logo{width:44px;height:44px;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.brand small{display:block;font-weight:500;font-size:14px;color:var(--ink2)}
.lang{display:flex;gap:6px}
.lang button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:16px;color:var(--ink2)}
.lang button.on{border-color:var(--pri);color:var(--pri);background:var(--pri-l)}
.clock{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600;font-size:18px;margin-right:18px}
.top-r{display:flex;align-items:center}
main{flex:1;display:flex;justify-content:center;padding:28px}
.screen{width:100%;max-width:980px;display:none}
.screen.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:34px;line-height:1.2;margin:0 0 8px}
h2{font-size:26px;margin:0 0 6px}
.sub{color:var(--ink2);margin:0 0 24px;font-size:19px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
/* Start */
.hero{text-align:center;padding:24px 0 10px}
.hero h1{font-size:44px}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:34px}
.big{border:0;border-radius:24px;padding:42px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff;
  font-size:30px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.08);min-height:240px;justify-content:center}
.big svg{width:68px;height:68px}
.big span{font-size:18px;font-weight:500;opacity:.92}
.big.in{background:var(--pri)} .big.in:active{background:var(--pri-d)}
.big.out{background:#2F3A45} .big.out:active{background:#1d252d}
.hint{margin-top:26px;text-align:center;color:var(--ink2);font-size:16px}
/* Steps */
.steps{display:flex;gap:8px;margin-bottom:22px}
.steps div{flex:1;height:8px;border-radius:99px;background:var(--line)}
.steps div.ok{background:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}
.full{grid-column:1/-1}
label.f{display:block;font-weight:600;font-size:16px;margin-bottom:7px}
label.f em{color:var(--pri);font-style:normal}
input.t{width:100%;font:inherit;font-size:20px;padding:15px 16px;border:1.5px solid #CBD0D6;border-radius:12px;background:#fff;color:var(--ink);outline:none}
input.t:focus{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-l)}
input.t.err{border-color:var(--red);background:var(--red-l)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1.5px solid #CBD0D6;background:#fff;border-radius:12px;padding:13px 18px;font-size:18px;font-weight:500;color:var(--ink)}
.chip.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d);font-weight:700}
.chips.err .chip{border-color:var(--red)}
label.f small{font-size:14px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:26px}
.btn{border:0;border-radius:14px;padding:18px 30px;font-size:20px;font-weight:700;min-width:180px}
.btn.p{background:var(--pri);color:#fff} .btn.p:active{background:var(--pri-d)}
.btn.p:disabled{background:#E2B4C5;cursor:not-allowed}
.btn.s{background:#fff;color:var(--ink);border:1.5px solid #CBD0D6}
.btn.g{background:var(--grn);color:#fff}
.btn.w{background:#fff;color:var(--red);border:1.5px solid #E6B3B3}
.msg{border-radius:12px;padding:14px 18px;font-size:17px;margin-top:16px;display:none}
.msg.on{display:block}
.msg.err{background:var(--red-l);color:var(--red)}
.msg.warn{background:var(--org-l);color:#8A4B00}
.msg.ok{background:var(--grn-l);color:#3F5E12}
/* Belehrung */
.bel{max-height:calc(100vh - 360px);min-height:320px;overflow-y:auto;padding:4px 26px 10px 4px;-webkit-overflow-scrolling:touch}
.bel section{padding:18px 0;border-bottom:1px solid var(--line)}
.bel section:last-child{border-bottom:0}
.bel h3{display:flex;gap:12px;align-items:center;font-size:21px;margin:0 0 10px}
.bel h3 i{font-style:normal;width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--pri-l);color:var(--pri);font-weight:800;font-size:17px}
.bel p{margin:6px 0}
.bel ul{margin:8px 0 0;padding-left:22px}
.bel li{margin:7px 0}
.bel .alert{background:var(--org-l);border-radius:12px;padding:12px 16px;margin-top:10px}
.scrollhint{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--pri);font-weight:600;font-size:16px;padding-top:12px}
.check{display:flex;gap:16px;align-items:flex-start;padding:16px 18px;border:1.5px solid #CBD0D6;border-radius:14px;background:#fff;margin-top:14px;font-size:18px;text-align:left;width:100%;color:var(--ink)}
.check .box{flex:none;width:32px;height:32px;border-radius:9px;border:2px solid #9AA3AD;display:grid;place-items:center;margin-top:1px;background:#fff}
.check.on{border-color:var(--grn);background:var(--grn-l)}
.check.on .box{background:var(--grn);border-color:var(--grn)}
.check.on .box::after{content:"";width:9px;height:17px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg) translate(-1px,-2px)}
.check.dis{opacity:.45;pointer-events:none}
.check.err{border-color:var(--red)}
.hz{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.hz button{text-align:left;border-radius:14px;padding:18px;border:1.5px solid #CBD0D6;background:#fff;font-size:18px;color:var(--ink)}
.hz button b{display:block;font-size:19px;margin-bottom:4px}
.hz button.on.y{border-color:var(--grn);background:var(--grn-l)}
.hz button.on.n{border-color:var(--org);background:var(--org-l)}
/* Signature */
.sigwrap{position:relative;border:2px dashed #B9C0C8;border-radius:14px;background:#fff;height:260px;touch-action:none}
.sigwrap.err{border-color:var(--red)}
.sigwrap canvas{width:100%;height:100%;display:block;border-radius:12px;touch-action:none}
.sigwrap .ph{position:absolute;left:0;right:0;bottom:46px;text-align:center;color:#A3ABB4;pointer-events:none;font-size:18px}
.sigwrap .line{position:absolute;left:30px;right:30px;bottom:40px;border-bottom:1.5px solid #C8CDD3;pointer-events:none}
.sigtools{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--ink2);font-size:16px}
.linkbtn{border:0;background:none;color:var(--pri);font-weight:700;font-size:17px;padding:8px 4px}
.summary{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;font-size:17px;background:var(--bg);border-radius:12px;padding:14px 18px;margin-bottom:18px}
.summary dt{color:var(--ink2)} .summary dd{margin:0;font-weight:600}
/* Done */
.done{text-align:center;padding:40px 20px}
.done .ic{width:110px;height:110px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;background:var(--grn-l);color:var(--grn)}
.done .ic svg{width:60px;height:60px}
.done h1{font-size:40px}
.done .time{font-size:22px;color:var(--ink2);margin:6px 0 20px}
.done .notice{display:inline-block;background:var(--org-l);color:#8A4B00;border-radius:14px;padding:14px 22px;font-weight:600;margin-top:8px;max-width:640px}
.countdown{margin-top:26px;color:var(--ink2);font-size:16px}
/* Checkout */
.results{display:flex;flex-direction:column;gap:12px;margin-top:18px;min-height:120px}
.res{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:20px;text-align:left;width:100%;color:var(--ink)}
.res b{font-size:22px}
.res small{display:block;color:var(--ink2);font-size:16px}
.res .go{background:#2F3A45;color:#fff;border-radius:10px;padding:12px 20px;font-weight:700;font-size:18px;white-space:nowrap}
.empty{color:var(--ink2);text-align:center;padding:26px}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,24,28,.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal.on{display:flex}
.modal .card{max-width:760px;width:100%;max-height:92vh;overflow:auto}
.modal .card.wide{max-width:1100px}
.spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;display:inline-block;vertical-align:-4px;margin-right:10px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.offline{display:none;background:var(--red);color:#fff;text-align:center;padding:8px;font-weight:600;font-size:16px}
.offline.on{display:block}
@media (max-width:760px){
  html,body{font-size:16px}
  main{padding:16px}
  header.top{padding:10px 16px}
  .clock{display:none}
  .brand small{display:none}
  .brand{font-size:18px}
  .lang button{padding:7px 12px;font-size:14px}
  .big-actions,.grid,.hz{grid-template-columns:1fr}
  .big{min-height:160px;padding:26px}
  .hero h1{font-size:32px}
  .card{padding:18px}
  .btn{min-width:0;padding:16px 20px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="offline" id="offline"></div>
  <header class="top">
    <div class="brand"><div class="logo">ABC</div><div><span id="t_firma_kurz">ABC Kochwerk</span><small id="t_site"></small></div></div>
    <div class="top-r"><div class="clock" id="clock"></div>
      <div class="lang"><button data-lang="de" class="on">Deutsch</button><button data-lang="en">English</button></div>
    </div>
  </header>
  <main>
    <!-- START -->
    <div class="screen on" id="s-start">
      <div class="hero"><h1 id="t_welcome"></h1><p class="sub" id="t_welcome_sub"></p></div>
      <div class="big-actions">
        <button class="big in" id="go-in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          <div id="t_btn_in"></div><span id="t_btn_in_sub"></span>
        </button>
        <button class="big out" id="go-out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          <div id="t_btn_out"></div><span id="t_btn_out_sub"></span>
        </button>
      </div>
      <p class="hint" id="t_start_hint"></p>
    </div>

    <!-- STEP 1 -->
    <div class="screen" id="s-daten">
      <div class="steps"><div class="ok"></div><div></div><div></div><div></div></div>
      <div class="card">
        <h2 id="t_s1"></h2><p class="sub" id="t_s1_sub"></p>
        <div class="grid" id="felder"></div>
        <div class="msg err" id="m_daten"></div>
        <div class="nav"><button class="btn s" data-back="s-start" id="t_cancel1"></button><button class="btn p" id="next1"></button></div>
      </div>
    </div>

    <!-- STEP 2 -->
    <div class="screen" id="s-belehrung">
      <div class="steps"><div class="ok"></div><div class="ok"></div><div></div><div></div></div>
      <div class="card">
        <h2 id="t_s2"></h2><p class="sub" id="t_s2_sub"></p>
        <div class="bel" id="bel"></div>
        <div class="scrollhint" id="scrollhint"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12l7 7 7-7"/></svg><span id="t_scroll"></span></div>
        <button class="check dis" id="ck_bel"><span class="box"></span><span id="t_ck_bel"></span></button>
        <div class="msg err" id="m_bel"></div>
        <div class="nav"><button class="btn s" data-back="s-daten" id="t_back2"></button><button class="btn p" id="next2" disabled></button></div>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="screen" id="s-gesundheit">
      <div class="steps"><div class="ok"></div><div class="ok"></div><div class="ok"></div><div></div></div>
      <div class="card">
        <h2 id="t_s3"></h2><p class="sub" id="t_s3_sub"></p>
        <div class="bel" style="max-height:none;min-height:0" id="gz_text"></div>
        <div class="hz">
          <button class="y" id="hz_yes"><b id="t_hz_yes"></b><span id="t_hz_yes_sub"></span></button>
          <button class="n" id="hz_no"><b id="t_hz_no"></b><span id="t_hz_no_sub"></span></button>
        </div>
        <div class="msg warn" id="m_hz_warn"></div>
        <div class="msg err" id="m_hz"></div>
        <div class="nav"><button class="btn s" data-back="s-belehrung" id="t_back3"></button><button class="btn p" id="next3"></button></div>
      </div>
    </div>

    <!-- STEP 4 -->
    <div class="screen" id="s-unterschrift">
      <div class="steps"><div class="ok"></div><div class="ok"></div><div class="ok"></div><div class="ok"></div></div>
      <div class="card">
        <h2 id="t_s4"></h2><p class="sub" id="t_s4_sub"></p>
        <dl class="summary" id="summary"></dl>
        <div class="sigwrap" id="sigwrap"><canvas id="sig"></canvas><div class="line"></div><div class="ph" id="t_sig_ph"></div></div>
        <div class="sigtools"><span id="t_sig_info"></span><button class="linkbtn" id="sig_clear"></button></div>
        <button class="check" id="ck_ds"><span class="box"></span><span><span id="t_ck_ds"></span> <a href="#" class="linkbtn" id="open_ds" style="padding:0"></a></span></button>
        <div class="msg err" id="m_sig"></div>
        <div class="nav"><button class="btn s" data-back="s-gesundheit" id="t_back4"></button><button class="btn p" id="submit"></button></div>
      </div>
    </div>

    <!-- DONE -->
    <div class="screen" id="s-done">
      <div class="card done">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
        <h1 id="done_title"></h1>
        <div class="time" id="done_time"></div>
        <div id="done_text"></div>
        <div class="notice" id="done_notice" style="display:none"></div>
        <div><button class="btn p" style="margin-top:28px" id="done_ok">OK</button></div>
        <div class="countdown" id="done_cd"></div>
      </div>
    </div>

    <!-- CHECKOUT -->
    <div class="screen" id="s-out">
      <div class="card">
        <h2 id="t_out"></h2><p class="sub" id="t_out_sub"></p>
        <input class="t" id="f_suche" autocomplete="off" autocapitalize="words" spellcheck="false" style="font-size:24px">
        <div class="results" id="results"></div>
        <div class="msg err" id="m_out"></div>
        <div class="nav"><button class="btn s" data-back="s-start" id="t_cancel_out"></button><span></span></div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="mod_ds"><div class="card"><h2 id="t_ds_title"></h2><div class="bel" style="max-height:60vh" id="ds_text"></div><div class="nav"><span></span><button class="btn p" id="ds_close">OK</button></div></div></div>
<div class="modal" id="mod_confirm"><div class="card" style="max-width:560px;text-align:center"><h2 id="conf_title"></h2><p class="sub" id="conf_text" style="margin-top:10px"></p><div class="nav"><button class="btn s" id="conf_no"></button><button class="btn p" id="conf_yes"></button></div></div></div>

<script src="formular-standard.js"></script>

  done_notice:'Please do not enter any kitchen, production or storage areas and inform your contact person.',
  cd:s=>`Back to start in ${s} s`,
  out:'Sign out', out_sub:'Please enter your first or last name (at least 2 letters).', out_ph:'Enter name …',
  out_none:'No signed-in visit found. Please check the spelling or ask at reception.',
  out_btn:'Sign out', since:t=>`since ${t}`, conf_title:n=>`Sign out ${n}?`, conf_text:'You will now be registered as “left”.', yes:'Yes, sign out', no:'Cancel',
  out_done:n=>`Goodbye, ${n}!`, out_done_time:t=>`Signed out at ${t}`,
  offline:'No internet connection – signing in is not possible right now. Please report to reception.',
  err_net:'Saving failed. Please try again or report to reception.', ds_title:'Privacy notice (Art. 13 GDPR)' }};

/* ================= HILFSFUNKTIONEN ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let lang='de';
const u=k=>UI[lang][k];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmm=d=>new Date(d).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'});
const clone=o=>JSON.parse(JSON.stringify(o));
async function rpc(fn,args){
  const r=await fetch(`${API.url}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:API.key,Authorization:`Bearer ${API.key}`},body:JSON.stringify(args||{})});
  const txt=await r.text(); let d=null; try{d=txt?JSON.parse(txt):null}catch(e){d=txt}
  if(!r.ok){ const e=new Error((d&&d.message)||('HTTP '+r.status)); e.server=true; throw e; }
  return d;
}
function show(id){
  $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); window.scrollTo(0,0);
  if(id==='s-unterschrift') setTimeout(sizeSig,30);
  if(id==='s-belehrung') setTimeout(checkScrolled,50);
  if(id==='s-out') setTimeout(()=>$('#f_suche').focus(),150);
}
function msg(id,text,cls){ const m=$(id); m.innerHTML=text||''; if(cls) m.className='msg '+cls; m.classList.toggle('on',!!text); }

/* ================= FORMULAR-KONFIGURATION ================= */
let F=clone(window.FORMULAR_STANDARD), F_ts=0;
const L=o=>(o&&(o[lang]||o.de))||'';
const tx=k=>L((F.texte||{})[k])||L(FORMULAR_STANDARD.texte[k]);
const vars=()=>({firma:F.stammdaten?.firma||'',adresse:F.stammdaten?.adresse||'',kontakt:F.stammdaten?.datenschutzKontakt||''});
const felder=()=>(F.felder||[]).filter(f=>f.aktiv!==false);
async function loadForm(){
  try{ const c=await rpc('besucher_formular_laden'); if(c&&Array.isArray(c.felder)){ F=c; try{localStorage.setItem('bes_formular',JSON.stringify(c))}catch(e){} } }
  catch(e){ try{ const c=JSON.parse(localStorage.getItem('bes_formular')||'null'); if(c&&c.felder) F=c; }catch(_){} }
  F_ts=Date.now();
}

/* ================= STATE ================= */
let S;
function resetState(){
  S={vals:{}, belOk:false, gz:null, ds:false, sigDirty:false, sigLen:0};
  $('#f_suche').value='';
  $$('.msg').forEach(m=>m.classList.remove('on'));
  $('#ck_bel').classList.remove('on'); $('#ck_bel').classList.add('dis'); $('#next2').disabled=true;
  $('#ck_ds').classList.remove('on'); $('#hz_yes').classList.remove('on'); $('#hz_no').classList.remove('on');
  $('#results').innerHTML=''; $('#bel').scrollTop=0;
  clearSig(); renderFelder();
}

/* ================= SPRACHE / TEXTE ================= */
function applyLang(){
  document.documentElement.lang=lang;
  $$('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  const ui={t_btn_in:'btn_in',t_btn_in_sub:'btn_in_sub',t_btn_out:'btn_out',t_btn_out_sub:'btn_out_sub',t_s1:'s1',t_s1_sub:'s1_sub',t_cancel1:'cancel',next1:'next',
    t_s2:'s2',t_scroll:'scroll',t_back2:'back',next2:'next',t_s3:'s3',t_s3_sub:'s3_sub',t_hz_yes:'hz_yes',t_hz_yes_sub:'hz_yes_sub',t_hz_no:'hz_no',t_hz_no_sub:'hz_no_sub',
    t_back3:'back',next3:'next',t_s4:'s4',t_s4_sub:'s4_sub',t_sig_ph:'sig_ph',t_sig_info:'sig_info',sig_clear:'sig_clear',t_ck_ds:'ck_ds',open_ds:'open_ds',t_back4:'back',submit:'submit',
    t_out:'out',t_out_sub:'out_sub',t_cancel_out:'cancel',t_ds_title:'ds_title'};
  for(const [id,k] of Object.entries(ui)){ const el=document.getElementById(id); if(el) el.textContent=u(k); }
  const cf={t_site:'site',t_welcome:'welcome',t_welcome_sub:'welcome_sub',t_start_hint:'start_hint',t_s2_sub:'s2_sub',t_ck_bel:'ck_bel'};
  for(const [id,k] of Object.entries(cf)) document.getElementById(id).textContent=tx(k);
  $('#t_firma_kurz').textContent=(F.stammdaten?.firma||'ABC Kochwerk').replace(/\s+GmbH$/,'');
  $('#gz_text').innerHTML=formText(L(F.gesundheit?.text));
  $('#f_suche').placeholder=u('out_ph'); $('#offline').textContent=u('offline');
  $('#ds_text').innerHTML=formText(L(F.datenschutz),vars());
  renderBel(); renderFelder();
  if(S && S.gz===false) msg('#m_hz_warn',formText(L(F.gesundheit?.warnung)),'warn');
  if($('#s-unterschrift').classList.contains('on')) renderSummary();
}
$$('.lang button').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; applyLang(); });

/* ================= SCHRITT 1: dynamische Felder ================= */
function renderFelder(){
  if(!S) return;
  const g=$('#felder');
  g.innerHTML=felder().map(f=>{
    const req=f.pflicht?' <em>*</em>':` <small style="color:var(--ink2);font-weight:500">${esc(u('optional'))}</small>`;
    if(f.typ==='auswahl'){
      return `<div class="full"><label class="f">${esc(L(f.label))}${req}</label><div class="chips" data-key="${esc(f.key)}">`+
        (f.optionen||[]).map((o,i)=>`<button class="chip ${S.vals[f.key]===i?'on':''}" data-i="${i}">${esc(L(o))}</button>`).join('')+`</div></div>`;
    }
    const type=f.typ==='email'?'email':f.typ==='tel'?'tel':'text';
    const extra=f.typ==='email'?'inputmode="email" autocapitalize="off" spellcheck="false"':f.typ==='tel'?'inputmode="tel"':'autocapitalize="words"';
    const dl=(f.optionen&&f.optionen.length)?`list="dl_${esc(f.key)}"`:'';
    return `<div class="${f.breite==='voll'?'full':''}"><label class="f" for="fld_${esc(f.key)}">${esc(L(f.label))}${req}</label>
      <input class="t" id="fld_${esc(f.key)}" data-key="${esc(f.key)}" type="${type}" ${extra} ${dl} autocomplete="off" maxlength="160" value="${esc(S.vals[f.key]??'')}">
      ${dl?`<datalist id="dl_${esc(f.key)}">${f.optionen.map(o=>`<option value="${esc(L(o))}">`).join('')}</datalist>`:''}</div>`;
  }).join('');
  g.querySelectorAll('input[data-key]').forEach(i=>i.addEventListener('input',()=>{ S.vals[i.dataset.key]=i.value; i.classList.remove('err'); msg('#m_daten',''); }));
  g.querySelectorAll('.chips').forEach(c=>c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ S.vals[c.dataset.key]=+b.dataset.i; msg('#m_daten',''); renderFelder(); }));
}
function wert(f){ // Wert für Speicherung (Auswahl immer als deutscher Text)
  const v=S.vals[f.key];
  if(f.typ==='auswahl') return (v===undefined||v===null)?'':((f.optionen||[])[v]?.de||'');
  return String(v??'').trim();
}
function wertAnzeige(f){ const v=S.vals[f.key]; return f.typ==='auswahl'?L((f.optionen||[])[v]):String(v??'').trim(); }
$('#go-in').onclick=()=>{ resetState(); show('s-daten'); goFullscreen(); };
$('#go-out').onclick=()=>{ resetState(); show('s-out'); goFullscreen(); };
$$('[data-back]').forEach(b=>b.onclick=()=>{ if(b.dataset.back==='s-start') resetState(); show(b.dataset.back); });
$('#next1').onclick=()=>{
  let ok=true, mailbad=false;
  for(const f of felder()){
    const v=wert(f);
    const el=f.typ==='auswahl'?$(`.chips[data-key="${CSS.escape(f.key)}"]`):$(`#fld_${CSS.escape(f.key)}`);
    let bad=f.pflicht&&!v;
    if(!bad && v && f.typ==='email' && !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v)){ bad=true; mailbad=true; }
    if(el) el.classList.toggle('err',bad); if(bad) ok=false;
  }
  if(!ok) return msg('#m_daten', mailbad&&felder().every(f=>!f.pflicht||wert(f))?u('err_mail'):u('err_req'));
  show('s-belehrung');
};

/* ================= SCHRITT 2: Belehrung ================= */
function renderBel(){
  $('#bel').innerHTML=(F.belehrung?.abschnitte||[]).map((s,i)=>`<section><h3><i>${i+1}</i>${esc(L(s.titel))}</h3>${formText(L(s.text))}</section>`).join('');
}
function belPlain(l){
  const Lx=o=>(o&&(o[l]||o.de))||'';
  return `Hygienebelehrung ${F.stammdaten?.firma||''} – ${F.stammdaten?.standort||''} (${F.belehrung?.version||'?'}, ${l.toUpperCase()})\n\n`+
    (F.belehrung?.abschnitte||[]).map((s,i)=>`${i+1}. ${Lx(s.titel)}\n${formPlain(Lx(s.text))}`).join('\n\n')+
    `\n\n${UI[l].s3}\n${formPlain(Lx(F.gesundheit?.text))}\n\nErklärung / Declaration:\n${Lx(F.texte?.ck_bel)||Lx(FORMULAR_STANDARD.texte.ck_bel)}`;
}
function checkScrolled(){ const b=$('#bel'); if(b.scrollTop+b.clientHeight>=b.scrollHeight-30){ $('#ck_bel').classList.remove('dis'); $('#scrollhint').style.visibility='hidden'; } else $('#scrollhint').style.visibility='visible'; }
$('#bel').addEventListener('scroll',checkScrolled,{passive:true});
$('#ck_bel').onclick=()=>{ S.belOk=!S.belOk; $('#ck_bel').classList.toggle('on',S.belOk); $('#next2').disabled=!S.belOk; msg('#m_bel',''); };
$('#next2').onclick=()=>{ if(!S.belOk) return msg('#m_bel',u('err_bel')); show('s-gesundheit'); };

/* ================= SCHRITT 3: Gesundheit ================= */
$('#hz_yes').onclick=()=>{ S.gz=true; $('#hz_yes').classList.add('on'); $('#hz_no').classList.remove('on'); msg('#m_hz_warn','','warn'); msg('#m_hz',''); };
$('#hz_no').onclick=()=>{ S.gz=false; $('#hz_no').classList.add('on'); $('#hz_yes').classList.remove('on'); msg('#m_hz_warn',formText(L(F.gesundheit?.warnung)),'warn'); msg('#m_hz',''); };
$('#next3').onclick=()=>{ if(S.gz===null) return msg('#m_hz',u('err_hz')); show('s-unterschrift'); renderSummary(); };

/* ================= SCHRITT 4: Unterschrift ================= */
function renderSummary(){
  const fv=felder().filter(f=>!['vorname','nachname'].includes(f.key)&&wertAnzeige(f));
  const rows=[[u('sum_name'),`${wert({key:'vorname'})} ${wert({key:'nachname'})}`],...fv.map(f=>[L(f.label).replace(/\s*…$/,''),wertAnzeige(f)]),
    [u('sum_bel'),u('sum_ok')],[u('sum_gz'),S.gz?u('sum_ok'):u('sum_nok')]];
  $('#summary').innerHTML=rows.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('');
}
const cv=$('#sig'), ctx=cv.getContext('2d'); let drawing=false, last=null;
function sizeSig(){
  const r=cv.getBoundingClientRect(); if(!r.width) return;
  const keep=S&&S.sigDirty?cv.toDataURL():null; const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#14213D'; ctx.lineWidth=2.6;
  if(keep){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=keep; }
}
function clearSig(){ ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); if(S){S.sigDirty=false;S.sigLen=0;} sizeSig(); $('#t_sig_ph').style.display=''; }
function pos(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing=true; last=pos(e); ctx.beginPath(); ctx.arc(last.x,last.y,1.2,0,Math.PI*2); ctx.fillStyle='#14213D'; ctx.fill(); S.sigDirty=true; $('#t_sig_ph').style.display='none'; $('#sigwrap').classList.remove('err'); });
cv.addEventListener('pointermove',e=>{ if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); S.sigLen+=Math.hypot(p.x-last.x,p.y-last.y); last=p; });
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>drawing=false));
$('#sig_clear').onclick=clearSig;
window.addEventListener('resize',()=>{ if($('#s-unterschrift').classList.contains('on')) sizeSig(); });
function sigPNG(){ const r=cv.getBoundingClientRect(); const w=Math.min(900,Math.round(r.width)); const h=Math.round(w*r.height/r.width);
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(cv,0,0,w,h); return c.toDataURL('image/png'); }
$('#ck_ds').onclick=e=>{ if(e.target.id==='open_ds') return; S.ds=!S.ds; $('#ck_ds').classList.toggle('on',S.ds); $('#ck_ds').classList.remove('err'); };
$('#open_ds').onclick=e=>{ e.preventDefault(); e.stopPropagation(); $('#mod_ds').classList.add('on'); };
$('#ds_close').onclick=()=>$('#mod_ds').classList.remove('on');

let sending=false;
$('#submit').onclick=async()=>{
  if(sending) return;
  if(!S.sigDirty||S.sigLen<60){ $('#sigwrap').classList.add('err'); return msg('#m_sig',u('err_sig')); }
  if(!S.ds){ $('#ck_ds').classList.add('err'); return msg('#m_sig',u('err_ds')); }
  msg('#m_sig',''); sending=true; const btn=$('#submit'); btn.disabled=true; btn.innerHTML=`<span class="spinner"></span>${esc(u('sending'))}`;
  const angaben={}; felder().forEach(f=>{ if(!['vorname','nachname'].includes(f.key)){ const v=wert(f); if(v) angaben[f.key]=v; } });
  const p={ vorname:wert({key:'vorname'}), nachname:wert({key:'nachname'}), angaben,
    belehrung_version:F.belehrung?.version||'?', belehrung_text:belPlain(lang), belehrung_bestaetigt:true,
    gesundheit_bestaetigt:S.gz===true, datenschutz_bestaetigt:true, sprache:lang, unterschrift:sigPNG(), geraet:'Kiosk '+(F.stammdaten?.standort||'') };
  try{ const r=await rpc('besucher_checkin',{p}); doneScreen('in',r.vorname,r.checkin_at,!p.gesundheit_bestaetigt); }
  catch(e){ msg('#m_sig',esc(u('err_net'))+(e.server?`<br><small>${esc(e.message)}</small>`:'')); }
  finally{ sending=false; btn.disabled=false; btn.textContent=u('submit'); }
};

/* ================= FERTIG ================= */
let cdTimer=null;
function doneScreen(kind,name,at,warn){
  show('s-done');
  $('#done_title').textContent=kind==='in'?u('done_title')(name):u('out_done')(name);
  $('#done_time').textContent=kind==='in'?u('done_time')(hhmm(at)):u('out_done_time')(hhmm(at));
  $('#done_text').textContent=kind==='in'?tx('done_text'):tx('out_done_text');
  const n=$('#done_notice'); n.style.display=warn?'inline-block':'none'; n.textContent=u('done_notice');
  let s=warn?20:12; clearInterval(cdTimer);
  const tick=()=>{ $('#done_cd').textContent=u('cd')(s); if(s--<=0){ clearInterval(cdTimer); home(); } };
  tick(); cdTimer=setInterval(tick,1000);
}
$('#done_ok').onclick=()=>{ clearInterval(cdTimer); home(); };
async function home(){ lang='de'; resetState(); applyLang(); show('s-start'); if(Date.now()-F_ts>120000){ await loadForm(); resetState(); applyLang(); } }

/* ================= ABMELDEN ================= */
let qTimer=null, pick=null;
$('#f_suche').addEventListener('input',()=>{
  clearTimeout(qTimer); msg('#m_out',''); const q=$('#f_suche').value.trim();
  if(q.length<2){ $('#results').innerHTML=''; return; }
  qTimer=setTimeout(async()=>{
    try{ const rows=await rpc('besucher_suche',{q}); if($('#f_suche').value.trim()!==q) return;
      $('#results').innerHTML=rows.length?rows.map(r=>`<button class="res" data-id="${r.id}" data-n="${esc(r.anzeige)}"><div><b>${esc(r.anzeige)}</b><small>${esc(r.firma||'')}${r.firma?' · ':''}${esc(u('since')(hhmm(r.checkin_at)))}</small></div><span class="go">${esc(u('out_btn'))}</span></button>`).join('')
        :`<div class="empty">${esc(u('out_none'))}</div>`;
      $$('#results .res').forEach(b=>b.onclick=()=>confirmOut(b.dataset.id,b.dataset.n));
    }catch(e){ msg('#m_out',esc(u('err_net'))); }
  },300);
});
function confirmOut(id,n){ pick={id}; $('#conf_title').textContent=u('conf_title')(n); $('#conf_text').textContent=u('conf_text'); $('#conf_yes').textContent=u('yes'); $('#conf_no').textContent=u('no'); $('#mod_confirm').classList.add('on'); }
$('#conf_no').onclick=()=>$('#mod_confirm').classList.remove('on');
$('#conf_yes').onclick=async()=>{ $('#mod_confirm').classList.remove('on');
  try{ const r=await rpc('besucher_checkout',{p_id:pick.id}); doneScreen('out',r.vorname,r.checkout_at,false); }
  catch(e){ msg('#m_out',esc(e.server?e.message:u('err_net'))); } };

/* ================= KIOSK ================= */
let idle=0;
['pointerdown','keydown','scroll','input','touchmove'].forEach(ev=>document.addEventListener(ev,()=>idle=0,{passive:true,capture:true}));
setInterval(()=>{ idle++; const cur=$('.screen.on')?.id;
  if(cur!=='s-start'&&cur!=='s-done'&&idle>API.leerlaufSekunden){ $$('.modal').forEach(m=>m.classList.remove('on')); home(); }
  if(cur==='s-start'&&idle>600&&Date.now()-F_ts>600000){ idle=0; loadForm().then(()=>{ if($('.screen.on')?.id==='s-start'){ resetState(); applyLang(); } }); }
},1000);
function clock(){ $('#clock').textContent=new Date().toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'}); }
clock(); setInterval(clock,15000);
function net(){ $('#offline').classList.toggle('on',!navigator.onLine); }
window.addEventListener('online',net); window.addEventListener('offline',net); net();
async function goFullscreen(){
  try{ if(!document.fullscreenElement&&document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen({navigationUI:'hide'}); }catch(e){}
  try{ if('wakeLock' in navigator&&!window._wl){ window._wl=await navigator.wakeLock.request('screen'); window._wl.addEventListener('release',()=>window._wl=null); } }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ window._wl=null; goFullscreen(); } });
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= START ================= */
resetState(); applyLang();
loadForm().then(()=>{ if($('.screen.on')?.id==='s-start'){ resetState(); applyLang(); } });
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
